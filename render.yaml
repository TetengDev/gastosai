# Render Blueprint — gastosai backend (free, no card).
# render.com -> New -> Blueprint -> pick this repo. Then set the `sync: false`
# secrets in the dashboard (values in .env.deploy). Frontend is on Vercel, DB on Supabase.
services:
  - type: web
    name: gastosai-api
    runtime: docker
    repo: https://github.com/TetengDev/gastosai
    branch: master
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    # No healthCheckPath: the free-tier JVM cold boot (~3 min) is slower than Render's
    # health-check deploy window and was looping the deploy. Render marks the service live
    # on port detection (8080) instead. /actuator/health is still available for manual checks.
    envVars:
      # Render routes to this port; the app binds 8080 (no code change).
      - key: PORT
        value: "8080"
      # prod profile exposes /actuator/health and tunes the connection pool.
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: validate
      - key: GASTOS_SEED_SAMPLE_DATA
        value: "false"
      - key: GASTOS_AI_PROVIDER
        value: openai
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: AI_RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: MONETIZATION_ENFORCE
        value: "false"
      # Secrets — set these in the Render dashboard (see .env.deploy). Never committed.
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: AI_KEY_ENCRYPTION_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Frontend origin used to build the magic-link URL in emails.
      - key: FRONTEND_BASE_URL
        sync: false
      # Email: Resend HTTP API (recommended on Render — its free tier BLOCKS outbound SMTP ports,
      # so Gmail/SMTP times out). Set RESEND_API_KEY and MAIL_FROM (e.g. onboarding@resend.dev for
      # testing, or your verified domain). When RESEND_API_KEY is set it takes priority over SMTP.
      - key: RESEND_API_KEY
        sync: false
      # SMTP fallback (won't work on Render free — kept for paid tiers / other hosts).
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      # Where contact/feedback submissions are emailed.
      - key: CONTACT_NOTIFICATION_EMAIL
        sync: false
      # Google sign-in (optional). Set to the OAuth client id to enable "Continue with Google";
      # the frontend must set VITE_GOOGLE_CLIENT_ID to the same value. Leave unset to keep it off.
      - key: GOOGLE_CLIENT_ID
        sync: false
