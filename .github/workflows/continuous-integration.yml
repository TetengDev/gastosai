name: Continuous Integration

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master, release/**]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate-release-branch:
    name: Validate release branch
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && (github.base_ref == 'master' || github.base_ref == 'main')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce version-cut policy
        env:
          HEAD: ${{ github.head_ref }}
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          # release/* is always allowed — it is the canonical version-cut path that auto-release.yml tags.
          if [[ "$HEAD" == release/* ]]; then
            echo "Branch '$HEAD' is a release branch — allowed."
            exit 0
          fi

          # For any other branch, the real invariant is: a PR that changes the version must come from release/*.
          # (auto-release.yml reads the version from frontend/package.json, so that is the source of truth.)
          git fetch origin "$BASE" --depth=1
          base_ver=$(git show "origin/$BASE:frontend/package.json" | jq -r .version)
          head_ver=$(jq -r .version frontend/package.json)
          if [[ "$base_ver" != "$head_ver" ]]; then
            echo "::error::Version changed ($base_ver -> $head_ver). Version bumps must come from a release/* branch."
            exit 1
          fi

          # No version change: allow only no-bump conventional branch types straight to master.
          if [[ ! "$HEAD" =~ ^(chore|docs|style|ci|test|refactor|build)/ ]]; then
            echo "::error::PRs to master must come from release/* (for version bumps) or a no-bump branch (chore|docs|style|ci|test|refactor|build)/*. Got: $HEAD"
            exit 1
          fi

          echo "Branch '$HEAD' is a no-bump branch with no version change — allowed."

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        working-directory: backend
        run: ./mvnw test

  frontend:
    name: Frontend audit & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Sync package-lock.json if out of date
        working-directory: frontend
        run: |
          npm install --package-lock-only
          if ! git diff --quiet package-lock.json; then
            echo "::warning::package-lock.json was out of sync with package.json. Commit the updated lock file."
          fi

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit for vulnerabilities
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Lint
        working-directory: frontend
        run: npm run lint

  security-scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Report-only (exit-code 0): surfaces vulnerable dependencies without blocking the build.
      # Promote to --exit-code 1 once the baseline is clean. Uses the official installer to avoid
      # pinning a marketplace action version.
      - name: Trivy filesystem scan
        continue-on-error: true
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b "$RUNNER_TEMP/bin"
          "$RUNNER_TEMP/bin/trivy" fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --offline-scan --exit-code 0 .
