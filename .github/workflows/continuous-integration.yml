name: Continuous Integration

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master, release/**]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate-release-branch:
    name: Validate release branch
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && (github.base_ref == 'master' || github.base_ref == 'main')
    steps:
      - name: Check source branch is release/*
        run: |
          branch="${{ github.head_ref }}"
          if [[ "$branch" != release/* ]]; then
            echo "::error::PRs to master must come from a release/* branch. Got: $branch"
            exit 1
          fi
          echo "Branch '$branch' is valid."

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        working-directory: backend
        run: ./mvnw test

  frontend:
    name: Frontend audit & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Sync package-lock.json if out of date
        working-directory: frontend
        run: |
          npm install --package-lock-only
          if ! git diff --quiet package-lock.json; then
            echo "::warning::package-lock.json was out of sync with package.json. Commit the updated lock file."
          fi

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit for vulnerabilities
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Lint
        working-directory: frontend
        run: npm run lint

  security-scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Report-only (exit-code 0): surfaces vulnerable dependencies without blocking the build.
      # Promote to --exit-code 1 once the baseline is clean. Uses the official installer to avoid
      # pinning a marketplace action version.
      - name: Trivy filesystem scan
        continue-on-error: true
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b "$RUNNER_TEMP/bin"
          "$RUNNER_TEMP/bin/trivy" fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --offline-scan --exit-code 0 .
