version: 2
# Grouped updates: all maven updates land in ONE backend PR and all npm updates in ONE
# frontend PR (instead of a PR per dependency). Both version- and security-updates are
# grouped. Dependabot's smallest interval is weekly (no native biweekly); the biweekly
# vulnerability *report* is produced separately by .github/workflows/security-scan.yml.
updates:
  - package-ecosystem: "maven"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Manila"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "backend"
    groups:
      backend-version-updates:
        applies-to: version-updates
        patterns: ["*"]
      backend-security-updates:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Manila"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "frontend"
    groups:
      frontend-version-updates:
        applies-to: version-updates
        patterns: ["*"]
      frontend-security-updates:
        applies-to: security-updates
        patterns: ["*"]
