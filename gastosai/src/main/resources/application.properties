spring.application.name=gastosai

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gastosai}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

gastos.openai.api-key=${OPENAI_API_KEY:}
gastos.openai.model=${OPENAI_MODEL:gpt-4o-mini}

# true = seed sample expenses when the table is empty (set GASTOS_SEED_SAMPLE_DATA=false in production)
gastos.seed-sample-data=${GASTOS_SEED_SAMPLE_DATA:true}